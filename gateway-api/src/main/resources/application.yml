server:
  port: 8080

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      routes:
        - id: balance-api
          uri: http://${BALANCE_API_HOST:localhost}:8081
          predicates:
            - Path=/api/balances/**
          filters:
            - StripPrefix=1
            - AuthTokenFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    com.demo.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
